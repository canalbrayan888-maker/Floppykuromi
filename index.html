<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kuromi Flappy 🖤</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#1a0a2e;display:flex;justify-content:center;align-items:center;font-family:'Nunito',sans-serif;overflow:hidden;touch-action:none;}
#gameWrapper{position:relative;}
canvas{display:block;border-radius:20px;box-shadow:0 0 60px rgba(255,182,255,0.4),0 0 120px rgba(180,100,255,0.2);}
#score-display{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:38px;color:white;text-shadow:0 0 10px rgba(255,150,255,0.8),2px 2px 0 rgba(100,0,150,0.5);pointer-events:none;z-index:10;white-space:nowrap;display:none;}
#timer-display{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:16px;color:rgba(255,220,255,0.9);text-shadow:1px 1px 4px rgba(100,0,150,0.6);pointer-events:none;z-index:10;white-space:nowrap;display:none;}
#countdown-wrap{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:15;}
#countdown-num{font-family:'Fredoka One',cursive;font-size:150px;color:white;text-shadow:0 0 40px rgba(255,100,255,1),5px 5px 0 #6600aa;}
#countdown-label{font-family:'Fredoka One',cursive;font-size:22px;color:#ffccff;text-shadow:0 0 10px rgba(255,100,255,0.8);margin-top:-10px;letter-spacing:2px;}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,40,0.87);border-radius:20px;z-index:20;pointer-events:all;backdrop-filter:blur(5px);}
#overlay.hidden{display:none;}
.overlay-title{font-family:'Fredoka One',cursive;font-size:50px;color:#ffb3f0;text-shadow:0 0 20px rgba(255,100,255,0.8),3px 3px 0 #6600aa;margin-bottom:4px;letter-spacing:2px;text-align:center;animation:titlePulse 2s ease-in-out infinite;}
.overlay-sub{font-size:14px;color:#e0aaff;margin-bottom:24px;text-align:center;opacity:.85;padding:0 20px;}
.overlay-img{width:100px;margin-bottom:10px;animation:bounce 1.2s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(200,100,255,0.7));}
.play-btn{background:linear-gradient(135deg,#cc44ff,#ff44bb);color:white;border:none;padding:14px 44px;font-family:'Fredoka One',cursive;font-size:22px;border-radius:50px;cursor:pointer;box-shadow:0 6px 24px rgba(200,0,255,0.4);transition:transform .15s;letter-spacing:1px;text-shadow:1px 1px 3px rgba(80,0,120,0.5);}
.play-btn:hover{transform:scale(1.07) translateY(-2px);}
.play-btn:active{transform:scale(0.97);}
.best-score{margin-top:14px;font-family:'Fredoka One',cursive;font-size:16px;color:#dda0ff;}
.game-over-title{font-family:'Fredoka One',cursive;font-size:44px;color:#ff88dd;text-shadow:0 0 20px rgba(255,100,200,0.8),3px 3px 0 #6600aa;margin-bottom:4px;}
.final-stats{background:rgba(100,0,180,0.3);border:2px solid rgba(255,150,255,0.3);border-radius:16px;padding:12px 28px;margin:12px 0 18px;text-align:center;}
.stat-row{font-family:'Fredoka One',cursive;font-size:17px;color:#f0ccff;line-height:1.8;}
.stat-val{color:#ffaaff;font-size:23px;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes titlePulse{0%,100%{text-shadow:0 0 20px rgba(255,100,255,0.8),3px 3px 0 #6600aa}50%{text-shadow:0 0 38px rgba(255,160,255,1),3px 3px 0 #9900dd}}
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="score-display">0</div>
  <div id="timer-display">⏱️ 0s</div>
  <div id="countdown-wrap">
    <span id="countdown-num">3</span>
    <span id="countdown-label">¡Preparate!</span>
  </div>
  <div id="overlay">
    <img class="overlay-img" id="kuromiOverlayImg" src="" alt="Kuromi">
    <div class="overlay-title">Kuromi<br>Flappy</div>
    <div class="overlay-sub">¡Toca o presiona espacio para volar!</div>
    <button class="play-btn" id="mainBtn">¡JUGAR! 🖤</button>
    <div class="best-score" id="bestDisplay"></div>
  </div>
</div>
